name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC + CUDA
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          # Volk, VMA and GLM are optional LunarG components — required because
          # CMakeLists.txt includes them from ${VULKAN_SDK}/Include/{Volk,vma,glm}.
          optional_components: com.lunarg.vulkan.volk,com.lunarg.vulkan.vma,com.lunarg.vulkan.glm
          install_runtime: true
          # Cache key is derived from vulkan_version only — adding optional
          # components does not invalidate a stale cache. Leave off until a
          # known-good install is confirmed, then re-enable.
          cache: false
          stripdown: true

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.1.1'
          method: network
          # *_dev sub-packages ship the .lib + headers needed for
          # find_package(CUDAToolkit) to create the IMPORTED targets.
          sub-packages: '["nvcc", "cudart", "cufft", "cufft_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'
          use-github-cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Verify artefacts
        shell: pwsh
        run: |
          $exe = "build/Release/cosmico.exe"
          if (-not (Test-Path $exe)) { throw "cosmico.exe not produced" }
          Write-Host "Built: $((Get-Item $exe).Length / 1MB) MB"
          # Sanity: shaders, simulations, resources copied next to exe
          foreach ($d in "shaders", "simulations", "resources") {
            if (-not (Test-Path "build/Release/$d")) { throw "$d/ not copied next to exe" }
          }
